version: "3.9"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["db-data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  db_service:
    build:
      context: .
      dockerfile: ./src/db_service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports: ["50050:50050"]
    depends_on: [db]

  session_service:
    build:
      context: .
      dockerfile: ./src/session_service/Dockerfile
    environment:
      DB_SERVICE_ADDR: db_service:50050
    ports: ["50051:50051"]
    depends_on: [db_service]

  message_service:
    build:
      context: .
      dockerfile: ./src/message_service/Dockerfile
    environment:
      DB_SERVICE_ADDR: db_service:50050
    ports: ["50052:50052"]
    depends_on: [db_service]

  api_gateway:
    build:
      context: .
      dockerfile: ./src/api_gateway/Dockerfile
    environment:
      API_KEY: ${API_KEY}
      SESSION_SERVICE_ADDR: session_service:50051
      MESSAGE_SERVICE_ADDR: message_service:50052
      RATE_LIMIT: ${RATE_LIMIT}
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
    ports: ["8000:80"]
    depends_on: [session_service, message_service]

volumes:
  db-data:
