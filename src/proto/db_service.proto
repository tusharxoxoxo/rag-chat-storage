syntax = "proto3";
package db_service;

service DBService {
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc ListSessions(Empty) returns (SessionList);
  rpc UpdateSession(UpdateSessionRequest) returns (Session);
  rpc DeleteSession(SessionId) returns (Empty);

  rpc CreateMessage(CreateMessageRequest) returns (Message);
  rpc ListMessages(ListMessagesRequest) returns (MessageList);
}

message Empty {}
message SessionId { int32 id = 1; }
message CreateSessionRequest { string name = 1; }
message UpdateSessionRequest { int32 id = 1; string name = 2; bool is_favorite = 3; }
message Session { int32 id = 1; string name = 2; bool is_favorite = 3; }
message SessionList { repeated Session sessions = 1; }
message CreateMessageRequest { int32 session_id = 1; string sender = 2; string content = 3; string context = 4; }
message Message { int32 id = 1; int32 session_id = 2; string sender = 3; string content = 4; string context = 5; }
message ListMessagesRequest { int32 session_id = 1; int32 skip = 2; int32 limit = 3; }
message MessageList { repeated Message messages = 1; }
