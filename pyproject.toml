[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chat-storage"
version = "0.1.0"
description = "A microservices-based RAG (Retrieve-Augment-Generate) chat storage system using FastAPI, gRPC, and PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "RAG Chat Storage Team"}
]
keywords = ["rag", "chat", "storage", "microservices", "grpc", "fastapi", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Database",
]

dependencies = [
    # Core gRPC and Protocol Buffers
    "grpcio>=1.75.0",
    "protobuf>=5.0.0",
    "grpcio-tools>=1.75.0",
    # FastAPI and web framework
    "fastapi>=0.95.2",
    "uvicorn[standard]>=0.22.0",
    "httpx>=0.27.0",
    # Database
    "SQLAlchemy>=2.0.15",
    "psycopg2-binary>=2.9.6",
    # Configuration and utilities
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.5",
    "limits>=1.5,<2.0",
    "contextvars>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]
test = [
    "pytest>=7.3.1",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/your-org/rag-chat-storage"
Repository = "https://github.com/your-org/rag-chat-storage"
Documentation = "https://github.com/your-org/rag-chat-storage#readme"
"Bug Tracker" = "https://github.com/your-org/rag-chat-storage/issues"

[project.scripts]
rag-chat-storage = "src.api_gateway.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "src*",
    "tests*"
]

[tool.setuptools.package-data]
"*" = ["*.proto", "*.py", "*.txt", "*.md"]

# Ruff configuration
[tool.ruff]

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

